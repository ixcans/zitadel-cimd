name: Build and publish

# ixcans/zitadel-cimd fork: this replaces upstream's full CI suite (lint, unit/integration
# tests, CodeQL, issue triage, semantic-release, homebrew/chart bump, npm packages). This
# fork sends nothing upstream and carries no ongoing PR/issue process, so none of that applies.
# Its two jobs are: test the fork's patches (test.yml), and compile the API binary and publish
# its container image.
#
# Publishing is tag-driven. A push to a branch publishes nothing. Tags are
# v<upstream version>-cimd.<n> (for example v4.19.4-cimd.2), the image tag is the git tag, and a
# tag is immutable: this workflow refuses to publish a version that already exists in the
# registry, so a pinned tag can never be swapped for a different image. To change what a
# deployment runs, cut the next -cimd.<n> tag. `latest` is not maintained (it still points at the
# last build made before publishing became tag-driven).
#
# Runners are GitHub-hosted (ubuntu-latest) ONLY. Do not point this at any internal/ARC
# runner fleet - this is a third-party-derived fork and must never touch internal infra.

on:
  push:
    tags:
      - "v*-cimd.*"
  # Re-run the publish for an existing tag (for example after a failed build). Run it against
  # the tag: `gh workflow run build-publish.yml --ref v4.19.4-cimd.2`. There is no version
  # input; the version is always the tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Fork-distinct build version - see cmd/build/info.go. Deliberately not a bare upstream
      # version string, so `zitadel --version` / the Version field always identifies this as the
      # ixcans CIMD fork, never confusable with a stock v4.19.4 build.
      - name: Resolve version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Publishing is tag-driven; run this workflow on a tag, not on the branch '$REF_NAME'."
            exit 1
          fi
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-cimd\.[0-9]+$'; then
            echo "::error::The tag '$REF_NAME' is not v<upstream version>-cimd.<n>."
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      # Tags are immutable. The image is public, so this reads the registry anonymously.
      - name: Refuse a version that is already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION is already published and tags are immutable; cut the next -cimd.<n> tag."
            exit 1
          fi
          case "$out" in
            *"not found"* | *MANIFEST_UNKNOWN* | *"manifest unknown"*) echo "$IMAGE:$VERSION is not published yet" ;;
            *)
              echo "::error::Could not tell whether $IMAGE:$VERSION is published: $out"
              exit 1
              ;;
          esac

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  build-publish:
    needs:
      - version
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .pb.go stubs (buf generate), statik-embedded assets and the console bundle
      # before `go mod tidy` runs, so tidy sees the full generated source tree. Porting the
      # CIMD PR's commits onto v4.19.4 (a base with a different dependency graph than the PR's
      # own v5/main) left go.mod slightly out of step with what the merged tree actually
      # imports; `go mod tidy` is the correct fix (CI is exactly where this heavy/authoritative
      # module resolution belongs - this step never runs on a contributor's own machine).
      - name: Generate stubs and assets
        run: pnpm nx run --nxBail @zitadel/api:generate

      - name: Tidy Go modules
        run: go mod tidy

      # Builds the API binary for linux/amd64 only (this fleet's one supported build target -
      # no arm64/macOS/Windows). Reuses the generate output cached by the previous step, then
      # compiles with build.version ldflag set to the fork-distinct version resolved above.
      - name: Build Linux amd64 API binary
        env:
          ZITADEL_VERSION: ${{ needs.version.outputs.version }}
        run: pnpm nx run --nxBail @zitadel/api:pack-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
