syntax = "proto3";

package zitadel.user.v2;

option go_package = "github.com/zitadel/zitadel/pkg/grpc/user/v2;user";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "zitadel/filter/v2/filter.proto";

// A federated credential lets a machine user authenticate with a token that a foreign issuer
// signed (a workload platform, a CI system, another identity provider) instead of with a key the
// machine user holds. It is the receiving half of workload identity federation: the credential
// names which issuer, which subject and which further claims may act as the machine user.
//
// Federated credentials are managed under their own permissions, separate from user.write, which
// manages the machine user's own keys: user.federated_credential.read, .write and .delete. By
// default only the instance owner holds them. A user cannot manage its own federated credentials,
// and only machine users can hold one.
message FederatedCredential {
  // The unique identifier of the credential.
  string id = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"69629012906488334\"";
    }
  ];
  // The machine user the credential belongs to.
  string user_id = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"69629012906488334\"";
    }
  ];
  // The organization of the machine user.
  string organization_id = 3 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"69629012906488334\"";
    }
  ];
  // The timestamp of the credential's creation.
  google.protobuf.Timestamp creation_date = 4;
  // The timestamp of the credential's last change.
  google.protobuf.Timestamp change_date = 5;
  // The issuer, compared exactly with the token's "iss" claim. An https URL.
  string issuer = 6;
  // Where the keys that verify the issuer's tokens come from.
  FederatedCredentialKeySource key_source = 7;
  // The algorithms the token may be signed with: a subset of ES256, RS256 and EdDSA.
  repeated string allowed_algorithms = 8;
  // The value the token's "aud" claim must contain.
  string audience = 9;
  // The claim that identifies the workload, and the value it must have.
  FederatedCredentialSubjectRule subject_rule = 10;
  // Further claims the token must carry with exactly these string values.
  repeated FederatedCredentialClaimCondition claim_conditions = 11;
  // How long after its issue time ("iat") a token is still accepted, even when it has not expired.
  google.protobuf.Duration max_token_age = 12;
  // The longest lifetime of the machine token issued in exchange for a token.
  google.protobuf.Duration max_token_lifetime = 13;
  // A disabled credential is kept but accepts no token.
  bool disabled = 14;
}

// FederatedCredentialKeySource says where the keys that verify the issuer's tokens come from.
message FederatedCredentialKeySource {
  oneof source {
    // The keys the issuer publishes, found through its OpenID Provider metadata at
    // {issuer}/.well-known/openid-configuration. The issuer must then be reachable on a public
    // address on port 443.
    FederatedCredentialIssuerMetadataKeys issuer_metadata = 1;
    // Public keys pinned on the credential; the issuer's metadata is not fetched.
    FederatedCredentialPinnedKeys pinned_keys = 2;
  }
}

message FederatedCredentialIssuerMetadataKeys {}

message FederatedCredentialPinnedKeys {
  // A JSON Web Key Set (RFC 7517) of public signature keys, each with a unique "kid": RSA keys of
  // at least 2048 bits for RS256, P-256 keys for ES256, Ed25519 keys for EdDSA. Every key must fit
  // one of the credential's allowed algorithms.
  string jwks = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"{\\\"keys\\\":[{\\\"kty\\\":\\\"EC\\\",\\\"crv\\\":\\\"P-256\\\",\\\"kid\\\":\\\"key-1\\\",\\\"x\\\":\\\"f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU\\\",\\\"y\\\":\\\"x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0\\\"}]}\"";
    }
  ];
}

// FederatedCredentialSubjectRule names the claim that identifies the workload and the value it must
// have. Prefer a claim the issuer never reassigns, such as an immutable ID. The claim's value in the
// token must be a string.
message FederatedCredentialSubjectRule {
  // The claim, for example "sub". Not one the exchange checks by itself (iss, aud, exp, nbf, iat, jti).
  string claim = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"sub\"";
    }
  ];
  oneof match {
    // The claim must have exactly this value.
    string exact = 2 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        example: "\"system:serviceaccount:ci:deployer\"";
      }
    ];
    // The claim must match this RE2 expression as a whole (it is anchored at both ends). The
    // expression must begin with literal text, so that it cannot match every subject.
    string pattern = 3 [
      (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
        example: "\"repo:example-org/deploy:ref:refs/heads/.+\"";
      }
    ];
  }
}

// FederatedCredentialClaimCondition requires a claim of the token to be a string equal to value.
message FederatedCredentialClaimCondition {
  string claim = 1 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"repository_owner_id\"";
    }
  ];
  string value = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"123456\"";
    }
  ];
}

// FederatedCredentialClaimConditions replaces all claim conditions of a credential; empty removes them.
message FederatedCredentialClaimConditions {
  repeated FederatedCredentialClaimCondition conditions = 1;
}

message AddFederatedCredentialRequest {
  // The machine user to add the credential to.
  string user_id = 1;
  // The issuer, compared exactly with the token's "iss" claim. An https URL without query or fragment.
  string issuer = 2 [
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      example: "\"https://token.actions.example.com\"";
    }
  ];
  // Where the keys that verify the issuer's tokens come from. Required.
  FederatedCredentialKeySource key_source = 3;
  // The algorithms the token may be signed with: one or more of ES256, RS256 and EdDSA.
  repeated string allowed_algorithms = 4;
  // The value the token's "aud" claim must contain.
  string audience = 5;
  // The claim that identifies the workload, and the value it must have. Required.
  FederatedCredentialSubjectRule subject_rule = 6;
  // Further claims the token must carry with exactly these string values. At most 20, one per claim.
  repeated FederatedCredentialClaimCondition claim_conditions = 7;
  // How long after its issue time a token is still accepted. More than 0, at most 24 hours.
  google.protobuf.Duration max_token_age = 8;
  // The longest lifetime of the machine token issued in exchange. More than 0, at most 1 hour.
  google.protobuf.Duration max_token_lifetime = 9;
  // Add the credential disabled.
  bool disabled = 10;
}

message AddFederatedCredentialResponse {
  // The unique identifier of the new credential.
  string credential_id = 1;
  // The timestamp of the credential's creation.
  google.protobuf.Timestamp creation_date = 2;
}

// Every field left out stays as it is. The changed credential is validated as a whole.
message UpdateFederatedCredentialRequest {
  string user_id = 1;
  string credential_id = 2;
  optional string issuer = 3;
  FederatedCredentialKeySource key_source = 4;
  // Replaces the allowed algorithms; left empty, they stay as they are.
  repeated string allowed_algorithms = 5;
  optional string audience = 6;
  FederatedCredentialSubjectRule subject_rule = 7;
  // Replaces the claim conditions; an empty list removes them.
  FederatedCredentialClaimConditions claim_conditions = 8;
  google.protobuf.Duration max_token_age = 9;
  google.protobuf.Duration max_token_lifetime = 10;
  // Disable (true) or enable (false) the credential.
  optional bool disabled = 11;
}

message UpdateFederatedCredentialResponse {
  // The timestamp of the change, or of the last change when nothing changed.
  google.protobuf.Timestamp change_date = 1;
}

message RemoveFederatedCredentialRequest {
  string user_id = 1;
  string credential_id = 2;
}

message RemoveFederatedCredentialResponse {
  google.protobuf.Timestamp deletion_date = 1;
}

message ListFederatedCredentialsRequest {
  // The machine user whose credentials are listed.
  string user_id = 1;
  // List limitations and ordering; the result is ordered by creation date.
  optional zitadel.filter.v2.PaginationRequest pagination = 2;
}

message ListFederatedCredentialsResponse {
  zitadel.filter.v2.PaginationResponse pagination = 1;
  // The credentials, disabled ones included.
  repeated FederatedCredential result = 2;
}
